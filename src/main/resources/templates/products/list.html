<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 목록 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(90deg, #1a1a2e, #0f3460); }
        .navbar-brand { font-weight: 800; color: #e94560 !important; font-size: 1.4rem; }
        .page-header { border-left: 4px solid #e94560; padding-left: 1rem; }
        .table thead { background: #0f3460; color: #fff; }
        .table tbody tr:hover { background-color: #f0f4ff; }
        .product-price { font-weight: 700; color: #e94560; }

        .pagination .page-item.active .page-link {
            background-color: #e94560 !important;
            border-color: #e94560 !important;
            color: #fff !important;
        }
        .pagination .page-link {
            color: #333;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 0.375rem 0.75rem;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/home}">홈</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/products}">상품 목록</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/products/add}">상품 등록</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/dashboard}">관리자</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/change-password}">비밀번호 변경</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <strong th:text="${successMessage}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="page-header">
            <h4 class="fw-bold mb-0">상품 목록</h4>
            <small class="text-muted" style="font-size: 0.9rem;">
                총 <span th:text="${productPage.totalElements}"></span>개 상품
                (페이지 <span th:text="${productPage.number + 1}"></span> / <span th:text="${productPage.totalPages}"></span>)
            </small>
        </div>
        <a th:href="@{/products/add}" class="btn btn-danger btn-sm px-4 fw-semibold" sec:authorize="hasRole('ADMIN')">+ 상품 등록</a>
    </div>

    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form th:action="@{/products}" method="get" class="row g-2 align-items-center">
                <div class="col-md-9">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" style="font-size: 0.95rem; height: 45px;" placeholder="상품명으로 검색">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary fw-semibold w-100" style="background-color: #007bff; border: none; height: 45px;">검 색</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary fw-semibold w-100 text-center text-decoration-none" style="color: #495057; background-color: #fff; border: 1px solid #ced4da; height: 45px; line-height: 33px;">초기화</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-0">
            <div th:if="${productPage.isEmpty()}" class="text-center py-5 text-muted">
                <p class="mb-0">검색 결과가 없습니다.</p>
            </div>

            <div th:unless="${productPage.isEmpty()}" class="table-responsive">
                <table class="table table-hover mb-0 align-middle" style="font-size: 0.95rem;">
                    <thead>
                    <tr>
                        <th class="ps-4" style="width:60px">#</th>
                        <th>상품명</th>
                        <th>설명</th>
                        <th class="text-end">가격</th>
                        <th class="text-center">재고</th>
                        <th class="text-center">등록일</th>
                        <th class="text-center" style="width:120px" sec:authorize="hasRole('ADMIN')">관리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${productPage.content}">
                        <td class="ps-4 text-muted small" th:text="${p.id}"></td>
                        <td>
                            <a th:href="@{/products/{id}(id=${p.id})}" class="text-decoration-none fw-semibold text-dark" th:text="${p.name}"></a>
                        </td>
                        <td class="text-muted small" th:text="${p.description}"></td>
                        <td class="text-end product-price" th:text="${#numbers.formatInteger(p.price, 1, 'COMMA') + '원'}"></td>
                        <td class="text-center">
                            <span th:if="${p.stock > 10}" class="badge bg-success" th:text="${p.stock}"></span>
                            <span th:if="${p.stock > 0 and p.stock <= 10}" class="badge bg-warning" th:text="${p.stock}"></span>
                            <span th:if="${p.stock == 0}" class="badge bg-danger">품절</span>
                        </td>
                        <td class="text-center text-muted small" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}"></td>
                        <td class="text-center" sec:authorize="hasRole('ADMIN')">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/products/{id}/edit(id=${p.id})}" class="btn btn-outline-primary btn-sm py-0 px-2" style="font-size: 0.85rem;">수정</a>
                                <form th:action="@{/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('삭제하시겠습니까?')" class="m-0">
                                    <button class="btn btn-outline-danger btn-sm py-0 px-2" style="font-size: 0.85rem;">삭제</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav class="mt-3" th:if="${productPage.totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!productPage.hasPrevious()} ? 'disabled'">
                <span class="page-link" th:if="${!productPage.hasPrevious()}">이전</span>
                <a class="page-link" th:unless="${!productPage.hasPrevious()}"
                   th:href="${keyword != null} ? @{/products(page=${productPage.number - 1}, size=${productPage.size}, keyword=${keyword})} : @{/products(page=${productPage.number - 1}, size=${productPage.size})}">이전</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
                class="page-item" th:classappend="${i == productPage.number} ? 'active'">
                <a class="page-link" th:href="${keyword != null} ? @{/products(page=${i}, size=${productPage.size}, keyword=${keyword})} : @{/products(page=${i}, size=${productPage.size})}" th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${!productPage.hasNext()} ? 'disabled'">
                <span class="page-link" th:if="${!productPage.hasNext()}">다음</span>
                <a class="page-link" th:unless="${!productPage.hasNext()}"
                   th:href="${keyword != null} ? @{/products(page=${productPage.number + 1}, size=${productPage.size}, keyword=${keyword})} : @{/products(page=${productPage.number + 1}, size=${productPage.size})}">다음</a>
            </li>
        </ul>
    </nav>
</div>

<footer class="mt-5 py-3 text-center border-top">
    <p class="text-muted mb-0" style="font-size: 0.9rem;"
       th:text="${'학번: 2371408 │ 성명: 박규현 │ 실습 수행 : ' + #temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일 a hh:mm:ss')}">
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
